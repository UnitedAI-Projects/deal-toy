<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MantelDocs</title>
  <meta name="description" content="MantelDocs CAD drafting workspace">
  <link data-trunk rel="icon" href="../../assets/app-icon/manteldocs-64.png">
  <link data-trunk rel="rust" data-bin="manteldocs-web" data-wasm-opt="z" data-weak-refs />

    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #22282f; }

    #manteldocs_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="manteldocs_canvas"></canvas>
  <div id="manteldocs_loading">Loading MantelDocs&hellip;</div>
</body>
</html>
