[package]
name = "mantelcad-render"
description = "MantelCAD view math (orbit camera, projection, picking rays), the description of headless pictures, and product render jobs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
raytrace-cpu = ["dep:rayon"]

[dependencies]
solidcore-record = { workspace = true }
solidcore-tess = { workspace = true }
mantelcad-color = { workspace = true }
mantelcad-viewport = { workspace = true }
mantelcad-geom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true, features = ["jpeg"] }
moxcms = { workspace = true }
png = { workspace = true }
robust = { workspace = true }
sha2 = { workspace = true }
web-time = { workspace = true }
weezl = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true, optional = true }
sysinfo = { workspace = true }

[dev-dependencies]
flate2 = "1"

[[example]]
name = "cpu_resource_smoke"
required-features = ["raytrace-cpu"]
