[package]
name = "mantelcad-sketch"
description = "MantelCAD sketches: points, curves, geometric constraints and dimensions, the constraint solver, and profile detection"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Opt-in developer instrumentation; normal builds contain no collection or clocks.
solver-profiling = []

[[example]]
name = "solve_profile"
required-features = ["solver-profiling"]

[dependencies]
solidcore-record = { workspace = true }
harfrust = "0.12"
mantelcad-geom = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
ttf-parser = { workspace = true }
unicode-bidi = "0.3"

[dev-dependencies]
serde_json = { workspace = true }
